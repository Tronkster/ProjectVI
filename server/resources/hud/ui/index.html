<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hud">
    <span class="speed" id="speed">–</span><span class="unit">km/h</span>
    <span class="players" id="players"></span>
  </div>
  <script>
    projectvi.on("update", ({ speed, players }) => {
      document.getElementById("speed").textContent = speed ?? "–";
      document.getElementById("players").textContent = players === 1 ? "1 player" : `${players} players`;
    });
  </script>
</body>
</html>
