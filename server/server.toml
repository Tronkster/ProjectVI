# ProjectVI server settings. Restart the server after changing this file.

[server]
name = "ProjectVI Dev Server"
description = "Local test server with the example resources."
port = 30120            # game port; players' launchers also download resources from it
max_players = 32
gamemode = "Freeroam"   # Roleplay, Racing, Freeroam or Other
region = "EU"
# bind = "0.0.0.0"      # network address to listen on

[master]
url = "http://localhost:30180"
public = true           # false keeps the server off the public list

[resources]
# Folders in resources/ to start, in order.
start = ["jobs", "welcome", "hud"]

[sync]
# Player positions travel over UDP on the same port number as [server] port. Open it for UDP too.
# enabled = true
# tick_rate = 20          # updates a second, each way
# stream_radius = 500     # metres: players farther apart than this don't see each other
# timeout_seconds = 10    # a player who sends nothing for this long is dropped
# characters = ["lucia", "jason"]  # story characters, given out in join order; later players keep their own look

[world]
# The in-game clock and weather, the same for every player. Scripts can change both.
# time = "12:00"             # in-game time when the server starts
# time_scale = 30            # in-game minutes per real minute (GTA V's is 30); 0 stops the clock
# weather = "clear"
# weather_cycle = []         # e.g. ["clear", "clouds", "rain"]: a new weather from the list every weather_minutes
# weather_minutes = 15

[scripting]
# dotnet_host = ""        # path to ProjectVI.ScriptHost; empty uses this repository's build
# wait_for_debugger = false
dev = true                # allows fakeplayer, as and netevent in the console. Turn off on real servers.

[permissions]
# Groups of verified identifiers (never names). Commands can require a group.
# For a quick test: fakeplayer add Kai discord:111   (Kai is then an admin)
admin = ["discord:111"]
